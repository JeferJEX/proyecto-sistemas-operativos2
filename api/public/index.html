<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Restaurante Delicias</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <header class="hero">
    <h1>Restaurante Delicias</h1>
    <p>Auténtica comida artesanal</p>
  </header>

  <main>
    <section class="menu-section">
      <h2>Menú</h2>
      <div id="menu" class="menu-grid"></div>
    </section>
  </main>

  <footer>© 2026 Restaurante Delicias</footer>

  <script>
    // Cargar el menú desde el backend
    async function loadMenu() {
      try {
        const res = await fetch('/api/items');
        const items = await res.json();
        const container = document.getElementById('menu');
        items.forEach(it => {
          const card = document.createElement('div');
          card.className = 'card';
          card.innerHTML = `
            <h3>${it.name}</h3>
            <p class="desc">${it.description || ''}</p>
            <div class="price">$${Number(it.price).toFixed(2)}</div>
            <button class="btn">Añadir</button>
          `;
          container.appendChild(card);
        });
      } catch (e) {
        console.error('Error cargando menú', e);
      }
    }
    document.addEventListener('DOMContentLoaded', loadMenu);
  </script>
</body>
</html>
